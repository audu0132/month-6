name: Enterprise CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    name: Build & Push Container Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
          - { name: api-gateway, path: ./services/api-gateway }
          - { name: auth-service, path: ./services/auth-service }
          - { name: user-service, path: ./services/user-service }
          - { name: product-service, path: ./services/product-service }
          - { name: order-service, path: ./services/order-service }
          - { name: frontend, path: ./frontend }

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image (${{ matrix.component.name }})
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.component.path }}
          file: ${{ matrix.component.path }}/Dockerfile
          push: false
          tags: enterprise/${{ matrix.component.name }}:${{ github.sha }},enterprise/${{ matrix.component.name }}:latest

  validate-kubernetes:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: [build-and-push]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Dry Run Manifest Validation
        run: |
          kubectl apply --dry-run=client -f kubernetes/configmaps/
          kubectl apply --dry-run=client -f kubernetes/services/
          kubectl apply --dry-run=client -f kubernetes/deployments/
