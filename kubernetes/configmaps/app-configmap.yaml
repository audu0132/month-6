apiVersion: v1
kind: ConfigMap
metadata:
  name: enterprise-mesh-config
  namespace: default
  labels:
    app.kubernetes.io/part-of: enterprise-platform
data:
  NODE_ENV: "production"
  PORT_GATEWAY: "4000"
  PORT_AUTH: "4001"
  PORT_USER: "4002"
  PORT_PRODUCT: "4003"
  PORT_ORDER: "4004"
  AUTH_SERVICE_URL: "http://auth-service:4001"
  USER_SERVICE_URL: "http://user-service:4002"
  PRODUCT_SERVICE_URL: "http://product-service:4003"
  ORDER_SERVICE_URL: "http://order-service:4004"
  CORS_ORIGIN: "http://frontend:3000"
