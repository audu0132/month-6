version: '3.8'

networks:
  enterprise-mesh:
    driver: bridge

volumes:
  mongo-data:
  redis-data:

services:
  # ==========================================
  # 1. API GATEWAY
  # ==========================================
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: enterprise-api-gateway
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - CORS_ORIGIN=http://localhost:3000
      - JWT_SECRET=super-secret-jwt-key-change-in-production-2026-auth
      - AUTH_SERVICE_URL=http://auth-service:4001
      - USER_SERVICE_URL=http://user-service:4002
      - PRODUCT_SERVICE_URL=http://product-service:4003
      - ORDER_SERVICE_URL=http://order-service:4004
    depends_on:
      - auth-service
      - user-service
      - product-service
      - order-service
    networks:
      - enterprise-mesh

  # ==========================================
  # 2. AUTH SERVICE
  # ==========================================
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: enterprise-auth-service
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      - NODE_ENV=production
      - PORT=4001
      - JWT_SECRET=super-secret-jwt-key-change-in-production-2026-auth
      - JWT_REFRESH_SECRET=super-secret-refresh-key-change-in-production-2026-auth
      - REDIS_URI=redis://redis:6379
    networks:
      - enterprise-mesh

  # ==========================================
  # 3. USER SERVICE
  # ==========================================
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: enterprise-user-service
    restart: unless-stopped
    ports:
      - "4002:4002"
    environment:
      - NODE_ENV=production
      - PORT=4002
      - AUTH_SERVICE_URL=http://auth-service:4001
    networks:
      - enterprise-mesh

  # ==========================================
  # 4. PRODUCT SERVICE
  # ==========================================
  product-service:
    build:
      context: ./services/product-service
      dockerfile: Dockerfile
    container_name: enterprise-product-service
    restart: unless-stopped
    ports:
      - "4003:4003"
    environment:
      - NODE_ENV=production
      - PORT=4003
    networks:
      - enterprise-mesh

  # ==========================================
  # 5. ORDER SERVICE
  # ==========================================
  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: enterprise-order-service
    restart: unless-stopped
    ports:
      - "4004:4004"
    environment:
      - NODE_ENV=production
      - PORT=4004
      - PRODUCT_SERVICE_URL=http://product-service:4003
      - USER_SERVICE_URL=http://user-service:4002
    depends_on:
      - product-service
      - user-service
    networks:
      - enterprise-mesh

  # ==========================================
  # 6. FRONTEND (REACT / VITE / NGINX)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: enterprise-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - api-gateway
    networks:
      - enterprise-mesh

  # ==========================================
  # 7. CACHING & DATABASE INFRASTRUCTURE
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: enterprise-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - enterprise-mesh

  mongodb:
    image: mongo:6-jammy
    container_name: enterprise-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - enterprise-mesh
